spring.application.name=sale-management

# PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/sale-mgmt
spring.datasource.username=postgres
spring.datasource.password=Work@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway: schema is owned by src/main/resources/db/migration.
# baseline-on-migrate marks an existing pre-Flyway database as V1 (V1 is only run on an empty database).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT (HS256). The secret must be at least 32 bytes and comes from the environment.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT8H

# Optional first-run admin: created at startup only if no ADMIN user exists yet.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

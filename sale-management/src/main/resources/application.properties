spring.application.name=sale-management

# PostgreSQL Database Connection Settings
spring.datasource.url=${ENV_DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/sale-mgmt}
spring.datasource.username=${ENV_DATA_SOURCE_USERNAME:postgres}
spring.datasource.password=${ENV_DATA_SOURCE_PW:Work@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.show-sql=true
# Recommended when Flyway manages the schema
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Enable Redis caching
spring.cache.type=redis

#ordinary-attentive-measure-38067.db.redis.io:14022

# Redis Cloud connection (password is supplied via env var only - never commit it)
spring.data.redis.host=${ENV_REDIS_HOST:ordinary-attentive-measure-38067.db.redis.io}
spring.data.redis.port=${ENV_REDIS_PORT:14022}
spring.data.redis.username=${ENV_REDIS_USERNAME:default}
spring.data.redis.password=${ENV_REDIS_PASSWORD:aU22ldAU69yQvnbj9ru0yi82OeeBDHhI}
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

# This Redis Cloud database does NOT have TLS enabled - enabling SSL makes the handshake fail
spring.data.redis.ssl.enabled=false

# Cache expiration: 10 minutes
spring.cache.redis.time-to-live=10m

# Flyway configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
# Existing schema has no history table yet: baseline at 0 so V1, V2... still run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0